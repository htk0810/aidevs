name: release-backend

# Deployment: pull only the backend image. Set BACKEND_IMAGE in backend/.env.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in backend/.env}
    pull_policy: always
    env_file:
      - .env.docker
    environment:
      # Keep stateful services outside this Compose project.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in backend/.env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
