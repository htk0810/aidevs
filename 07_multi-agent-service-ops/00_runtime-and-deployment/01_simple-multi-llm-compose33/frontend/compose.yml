name: aws-tk-frontend

# Local development: build and run only the frontend service.
# Set BACKEND_URL in frontend/.env to the independently deployed backend URL.
services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in frontend/.env}
    build: .
    env_file:
      - .env.docker
    environment:
      # Resolve the backend through the Docker host when both services run on
      # the same EC2 instance but in separate Compose projects.
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in frontend/.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    restart: unless-stopped
