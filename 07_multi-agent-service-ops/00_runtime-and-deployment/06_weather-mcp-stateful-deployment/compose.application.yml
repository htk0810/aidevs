name: weather-mcp-application
services:
  weather-mcp:
    build: ./mcp_server
    networks: [weather-stateful]
    expose: ["8010"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      WEATHER_MCP_URL: http://weather-mcp:8010/mcp
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_user}:${POSTGRES_PASSWORD:-agent_pwd}@database:5432/${POSTGRES_DB:-agent_db}
      REDIS_URL: redis://redis:6379/0
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ports: ["8000:8000"]
    networks: [weather-stateful]
    depends_on:
      weather-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    networks: [weather-stateful]
    depends_on:
      backend:
        condition: service_healthy
networks:
  weather-stateful:
    external: true
    name: weather-stateful
