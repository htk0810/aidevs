# 시나리오: 수신자 PC에는 PostgreSQL·Redis·Ollama가 이미 Docker Container로 실행 중이다.
# 수업 운영자가 Registry에 올린 Backend·Frontend Image만 내려받아 실행한다.
name: simple-multi-llm-release

services:
  backend:
    # .env에서 Registry Image와 버전을 지정한다.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE을 .env에 설정하세요}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent_user:agent_pwd@host.docker.internal:5433/agent_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma3:4b}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    # .env에서 Registry Image와 버전을 지정한다.
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE을 .env에 설정하세요}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
