name: multi-agent-ops

x-app-common: &app-common
  build:
    context: ../..
    dockerfile: 09_integrated-deployment-and-operations/deploy/Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - agent-network

services:
  api:
    <<: *app-common
    command: uvicorn backend:app --app-dir 08_multi-ai-agent-service --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://host.docker.internal:6379/0
      DATABASE_URL: postgresql://agent_user:agent_pwd@host.docker.internal:5433/agent_db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "09_integrated-deployment-and-operations/deploy/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-common
    command: python 09_integrated-deployment-and-operations/worker.py
    environment:
      REDIS_URL: redis://host.docker.internal:6379/0
      DATABASE_URL: postgresql://agent_user:agent_pwd@host.docker.internal:5433/agent_db
      TRAVEL_MCP_URL: http://mcp:8010/mcp

  frontend:
    <<: *app-common
    command: streamlit run 08_multi-ai-agent-service/frontend.py --server.address 0.0.0.0 --server.port 8501
    environment:
      MULTI_AGENT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  mcp:
    <<: *app-common
    command: python 09_integrated-deployment-and-operations/mcp_server.py
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
    ports:
      - "8010:8010"

networks:
  agent-network:
    driver: bridge
