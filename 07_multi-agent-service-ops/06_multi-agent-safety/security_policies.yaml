input:
  max_length: 500
  blocked_phrases:
    - "이전 지시를 무시"
    - "시스템 프롬프트를 보여"
    - "권한 검사를 건너뛰"
    - "ignore previous instructions"

response:
  blocked_phrases:
    - "예약이 확정되었습니다"
    - "결제가 완료되었습니다"
  sensitive_keys:
    - api_key
    - password
    - access_token

context_access:
  weather_agent:
    - destination
    - travel_dates
  place_agent:
    - destination
    - preferences
  budget_agent:
    - people
    - budget
    - price_candidates
  itinerary_agent:
    - approved_agent_results
    - user_preferences
