name: 07 Simple Multi LLM Compose33 CI CD

on:
  push:
    branches:
      - main
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/**"
      - ".github/workflows/07-simple-multi-llm-compose33-cicd.yml"
  pull_request:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/**"
      - ".github/workflows/07-simple-multi-llm-compose33-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, publish, and deploy to the production EC2 instances"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simple-multi-llm-compose33-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIRECTORY: 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/simple-multi-llm-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/simple-multi-llm-frontend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIRECTORY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Test backend with fake dependencies
        working-directory: ${{ env.PROJECT_DIRECTORY }}/backend
        run: python -m pytest test_app.py -q

      - name: Prepare CI environment files
        run: |
          cp backend/.env.docker.example backend/.env.docker
          cp frontend/.env.docker.example frontend/.env.docker

      - name: Validate backend Compose
        working-directory: ${{ env.PROJECT_DIRECTORY }}/backend
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:ci
          DATABASE_URL: postgresql://agent_user:agent_pwd@host.docker.internal:5433/agent_db
          REDIS_URL: redis://host.docker.internal:6379/0
        run: docker compose -f compose.yml config --quiet

      - name: Validate frontend Compose
        working-directory: ${{ env.PROJECT_DIRECTORY }}/frontend
        env:
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:ci
          BACKEND_URL: http://backend.example:8000
        run: docker compose -f compose.yml config --quiet

      - name: Build backend image
        working-directory: ${{ env.PROJECT_DIRECTORY }}/backend
        run: docker build --tag "${BACKEND_IMAGE}:ci" .

      - name: Build frontend image
        working-directory: ${{ env.PROJECT_DIRECTORY }}/frontend
        run: docker build --tag "${FRONTEND_IMAGE}:ci" .

  publish-images:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIRECTORY }}/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=simple-multi-llm-backend
          cache-to: type=gha,mode=max,scope=simple-multi-llm-backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIRECTORY }}/frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=simple-multi-llm-frontend
          cache-to: type=gha,mode=max,scope=simple-multi-llm-frontend

  deploy-production:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure backend SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy and deploy backend
        env:
          AWS_HOST: ${{ secrets.BACKEND_AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/simple-multi-llm/backend'
          scp "$PROJECT_DIRECTORY/backend/compose.release.yml" "$AWS_USER@$AWS_HOST:~/simple-multi-llm/backend/compose.release.yml"
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/simple-multi-llm/backend && test -f .env && test -f .env.docker && docker compose -f compose.release.yml config --quiet && docker compose -f compose.release.yml pull && docker compose -f compose.release.yml up -d --force-recreate && backend_port="$(docker compose -f compose.release.yml port backend 8000 | head -n 1 | sed "s/.*://")" && test -n "$backend_port" && curl --fail --retry 18 --retry-delay 5 "http://127.0.0.1:${backend_port}/health/ready"'

      - name: Configure frontend SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FRONTEND_SSH_KNOWN_HOSTS }}
        run: |
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy and deploy frontend
        env:
          AWS_HOST: ${{ secrets.FRONTEND_AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/simple-multi-llm/frontend'
          scp "$PROJECT_DIRECTORY/frontend/compose.release.yml" "$AWS_USER@$AWS_HOST:~/simple-multi-llm/frontend/compose.release.yml"
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/simple-multi-llm/frontend && test -f .env && test -f .env.docker && docker compose -f compose.release.yml config --quiet && docker compose -f compose.release.yml pull && docker compose -f compose.release.yml up -d --force-recreate && frontend_port="$(docker compose -f compose.release.yml port frontend 8501 | head -n 1 | sed "s/.*://")" && test -n "$frontend_port" && curl --fail --retry 18 --retry-delay 5 "http://127.0.0.1:${frontend_port}/_stcore/health"'
