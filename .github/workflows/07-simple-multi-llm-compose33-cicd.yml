name: 07 Simple Multi LLM Compose33 CI CD

on:
  push:
    branches:
      - main
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33/**"
      - ".github/workflows/07-simple-multi-llm-compose33-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Test and deploy from main to the production EC2 instance"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simple-multi-llm-compose33-main
  cancel-in-progress: false

env:
  PROJECT_DIRECTORY: 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose33

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIRECTORY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Test backend with fake dependencies
        working-directory: ${{ env.PROJECT_DIRECTORY }}/backend
        run: python -m pytest test_app.py -q

      - name: Prepare CI environment files
        run: |
          touch backend/.env.docker
          touch frontend/.env.docker

      - name: Validate backend Compose
        working-directory: ${{ env.PROJECT_DIRECTORY }}/backend
        env:
          BACKEND_IMAGE: simple-multi-llm-backend:ci
          DATABASE_URL: postgresql://agent_user:agent_pwd@host.docker.internal:5433/agent_db
          REDIS_URL: redis://host.docker.internal:6379/0
        run: docker compose -f compose.yml config --quiet

      - name: Validate frontend Compose
        working-directory: ${{ env.PROJECT_DIRECTORY }}/frontend
        env:
          FRONTEND_IMAGE: simple-multi-llm-frontend:ci
          BACKEND_URL: http://backend.example:8000
        run: docker compose -f compose.yml config --quiet

      - name: Build backend image
        working-directory: ${{ env.PROJECT_DIRECTORY }}/backend
        run: docker build --tag simple-multi-llm-backend:ci .

      - name: Build frontend image
        working-directory: ${{ env.PROJECT_DIRECTORY }}/frontend
        run: docker build --tag simple-multi-llm-frontend:ci .

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy backend source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/simple-multi-llm/backend'
          scp "$PROJECT_DIRECTORY/backend/Dockerfile" "$PROJECT_DIRECTORY/backend/app.py" "$PROJECT_DIRECTORY/backend/services.py" "$PROJECT_DIRECTORY/backend/requirements.txt" "$PROJECT_DIRECTORY/backend/compose.yml" "$AWS_USER@$AWS_HOST:~/simple-multi-llm/backend/"

      - name: Build and deploy backend on EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/simple-multi-llm/backend && test -f .env && test -f .env.docker && export BACKEND_IMAGE=simple-multi-llm-backend:latest && docker compose -f compose.yml config --quiet && docker compose -f compose.yml up -d --build --force-recreate && backend_port="$(docker compose -f compose.yml port backend 8000 | head -n 1 | sed "s/.*://")" && test -n "$backend_port" && curl --fail --retry 24 --retry-delay 5 --retry-all-errors "http://127.0.0.1:${backend_port}/health/ready"'

      - name: Copy frontend source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/simple-multi-llm/frontend'
          scp "$PROJECT_DIRECTORY/frontend/Dockerfile" "$PROJECT_DIRECTORY/frontend/app.py" "$PROJECT_DIRECTORY/frontend/requirements.txt" "$PROJECT_DIRECTORY/frontend/compose.yml" "$AWS_USER@$AWS_HOST:~/simple-multi-llm/frontend/"

      - name: Build and deploy frontend on EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/simple-multi-llm/frontend && test -f .env && test -f .env.docker && export FRONTEND_IMAGE=simple-multi-llm-frontend:latest && docker compose -f compose.yml config --quiet && docker compose -f compose.yml up -d --build --force-recreate && frontend_port="$(docker compose -f compose.yml port frontend 8501 | head -n 1 | sed "s/.*://")" && test -n "$frontend_port" && curl --fail --retry 24 --retry-delay 5 --retry-all-errors "http://127.0.0.1:${frontend_port}/_stcore/health"'
