name: 07 Simple Compose CI

on:
  push:
    paths:
      - "07_multi-agent-service-ops/00_service_ops/01_simple-compose/**"
      - ".github/workflows/07-simple-compose-ci.yml"
  pull_request:
    paths:
      - "07_multi-agent-service-ops/00_service_ops/01_simple-compose/**"
      - ".github/workflows/07-simple-compose-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_multi-agent-service-ops/00_service_ops/01_simple-compose

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Test backend
        run: python -m pytest backend/test_app.py -q

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build frontend and backend images
        run: docker compose build

